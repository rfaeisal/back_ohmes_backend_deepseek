name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # ============================================================
  # Lint & Type Check (fast fail)
  # ============================================================
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  # ============================================================
  # Unit + Integration Tests (dengan PostgreSQL)
  # ============================================================
  test:
    name: Test (Unit + Integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mes_user
          POSTGRES_PASSWORD: mes_pass
          POSTGRES_DB: mes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mes_user -d mes_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://mes_user:mes_pass@localhost:5432/mes_test
      DATABASE_MIGRATION_URL: postgres://mes_user:mes_pass@localhost:5432/mes_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_secret_for_ci_only_do_not_use_in_prod
      HMAC_KEY_ENCRYPTION: test_hmac_key_for_ci_only
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test:unit
      - run: pnpm test:integration
      - name: Enforce coverage threshold
        run: pnpm test:coverage

  # ============================================================
  # Build (Next.js)
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          DATABASE_URL: postgres://build:build@localhost:5432/build
          JWT_SECRET: build_secret_placeholder_not_used_in_build
          JWT_ISSUER: mes.hummer
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_BASE_URL: https://mes.hummer.example

  # ============================================================
  # Security Audit
  # ============================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: false
      # Optional: CodeQL, Snyk, dsb.

  # ============================================================
  # E2E (hanya jalan setelah preview deploy — di workflow terpisah)
