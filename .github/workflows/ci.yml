name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Wajib sinkron dengan pnpm lokal & Dockerfile — lockfile ditulis pnpm 11
  # (pnpm-workspace.yaml pakai allowBuilds/minimumReleaseAge), pnpm 9 menolak
  # frozen-lockfile hasil pnpm 11. Versi EKSAK — action-setup gagal
  # resolve "11" polos (lookup dist-tag)
  PNPM_VERSION: "11.5.1"

jobs:
  # ============================================================
  # Lint & Type Check (fast fail)
  # ============================================================
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  # ============================================================
  # Unit + Integration Tests (dengan PostgreSQL)
  # ============================================================
  test:
    name: Test (Unit + Integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mes_user
          POSTGRES_PASSWORD: mes_pass
          POSTGRES_DB: mes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mes_user -d mes_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://mes_user:mes_pass@localhost:5432/mes_test
      DATABASE_MIGRATION_URL: postgres://mes_user:mes_pass@localhost:5432/mes_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_secret_for_ci_only_do_not_use_in_prod
      HMAC_KEY_ENCRYPTION: test_hmac_key_for_ci_only
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test:unit
      - run: pnpm test:integration
      - name: Coverage report (non-blocking — threshold 80% aspirasional)
        # Threshold di vitest.config.ts (80/75/80/80) belum tercapai:
        # test saat ini cover calc/utils/auth, lapisan service 0% (~1% line).
        # Tetap dijalankan agar angka coverage terlihat di log; memblokir CI
        # baru diaktifkan setelah ada effort test service-layer.
        run: pnpm test:coverage
        continue-on-error: true

  # ============================================================
  # Build (Next.js)
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          DATABASE_URL: postgres://build:build@localhost:5432/build
          JWT_SECRET: build_secret_placeholder_not_used_in_build
          JWT_ISSUER: mes.hummer
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_BASE_URL: https://mes.hummer.example

  # ============================================================
  # Security Audit
  # ============================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: false
      # Optional: CodeQL, Snyk, dsb.

  # ============================================================
  # E2E (Playwright) — rantai bisnis penuh 9 spec
  # DB mes_e2e dibuat ulang via scripts/e2e-reset-db.mjs (mode CI:
  # psql langsung ke service postgres — tanpa docker-in-docker).
  # webServer Playwright menjalankan next build && next start -p 3100
  # (distDir .next-e2e), jadi DB harus siap SEBELUM playwright test.
  # ============================================================
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mes_user
          POSTGRES_PASSWORD: mes_pass
          POSTGRES_DB: postgres # maintenance DB untuk DROP/CREATE mes_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mes_user -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgres://mes_app:mes_app_pass@localhost:5432/mes_e2e
      E2E_ADMIN_DATABASE_URL: postgres://mes_user:mes_pass@localhost:5432/mes_e2e
      E2E_DB_MAINTENANCE_DSN: postgres://mes_user:mes_pass@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Reset DB mes_e2e: drop → create → migrate → migrasi manual → seed
      - run: node scripts/e2e-reset-db.mjs
      # Tanpa script test:e2e penuh — reset DB sudah dijalankan di atas
      - run: pnpm test:e2e:iterate
      - name: Upload laporan Playwright (kalau gagal)
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
