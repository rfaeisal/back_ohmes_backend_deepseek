# =============================================================================
# Production Docker Compose — MES + WMS Hummer
# =============================================================================
# Usage: docker compose -f docker-compose.prod.yml up -d
# =============================================================================

services:
  app:
    build: .
    container_name: ohmes-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: ohmes-postgres
    environment:
      POSTGRES_USER: mes_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mes_pass}
      POSTGRES_DB: mes_prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mes_user", "-d", "mes_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
